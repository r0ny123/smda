name: Collect MSVC x64 Targets

on:
  push:
    branches: [ci/msvc-x64-targets]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  collect:
    name: Collect MSVC x64 PE/PDB Targets
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      ARTIFACT_DIR: collection-output
      CONTEXT_FILE: collection-context.json
      EXPECTED_CORPUS_TARGET_COUNT: 6
      EXPECTED_EXTERNAL_SOURCE_COUNT: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Initialize failure artifact
        run: |
          New-Item -ItemType Directory -Force -Path $env:ARTIFACT_DIR | Out-Null
          Set-Content -Encoding utf8 -Path "$env:ARTIFACT_DIR/manifest.jsonl" -Value ""
          @{
            schema_version = 1
            status = "error"
            pe_debug_candidate_count = 0
            match_record_count = 0
            unique_binary_count = 0
            unique_symbol_count = 0
            error = "collection did not complete"
          } | ConvertTo-Json | Set-Content -Encoding utf8 -Path "$env:ARTIFACT_DIR/summary.json"
          @{
            schema_version = 1
            status = "error"
            runner = @{
              label = "windows-2022"
              os = $env:RUNNER_OS
              architecture = $env:RUNNER_ARCH
              image = "$env:ImageOS-$env:ImageVersion"
            }
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 -Path "$env:ARTIFACT_DIR/toolchain.json"
          @(
            "runner_label=windows-2022"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "image_os=$env:ImageOS"
            "image_version=$env:ImageVersion"
          ) | Set-Content -Encoding utf8 -Path "$env:ARTIFACT_DIR/runner-metadata.txt"

      - name: Resolve Visual Studio toolchain
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere was not found" }
          $visualStudio = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | ConvertFrom-Json)
          if ($null -eq $visualStudio) { throw "No Visual Studio instance with MSVC x64 tools was found" }
          if ($visualStudio -is [System.Array]) { $visualStudio = $visualStudio[0] }
          $toolsetsRoot = Join-Path $visualStudio.installationPath "VC\Tools\MSVC"
          $toolset = Get-ChildItem -Path $toolsetsRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if ($null -eq $toolset) { throw "No MSVC toolset was found" }
          $vsDevCmd = Join-Path $visualStudio.installationPath "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $vsDevCmd)) { throw "VsDevCmd.bat was not found" }
          $pdbutilFromPath = Get-Command llvm-pdbutil.exe -ErrorAction SilentlyContinue
          $pdbutilCandidates = @(
            $(if ($null -ne $pdbutilFromPath) { $pdbutilFromPath.Source })
            (Join-Path $env:ProgramFiles "LLVM\bin\llvm-pdbutil.exe")
            (Join-Path $visualStudio.installationPath "VC\Tools\Llvm\x64\bin\llvm-pdbutil.exe")
          )
          $pdbutil = $pdbutilCandidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if ($null -eq $pdbutil) { throw "llvm-pdbutil.exe was not found" }
          $pdbutilVersionLines = @(& $pdbutil --version | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          $pdbutilVersion = $pdbutilVersionLines -join " | "
          $externalManifestPath = Join-Path $env:GITHUB_WORKSPACE ".github/workflows/data/msvc_external_sources.json"
          $externalManifest = Get-Content -Raw $externalManifestPath | ConvertFrom-Json
          Copy-Item -Force $externalManifestPath "$env:ARTIFACT_DIR/external-sources.json"
          $corpusVariants = @(
            [ordered]@{ name = "c-o1-nogs"; source = "tests/msvc_x64_corpus/prologue_c.c"; compiler_options = @("/O1", "/Ob0", "/GS-"); linker_options = @() }
            [ordered]@{ name = "c-o2-gs"; source = "tests/msvc_x64_corpus/prologue_c.c"; compiler_options = @("/O2", "/Ob2", "/GS"); linker_options = @() }
            [ordered]@{ name = "cpp-od-gs"; source = "tests/msvc_x64_corpus/prologue_cpp.cpp"; compiler_options = @("/Od", "/Ob0", "/GS", "/EHsc"); linker_options = @() }
            [ordered]@{ name = "cpp-o1-nogs"; source = "tests/msvc_x64_corpus/prologue_cpp.cpp"; compiler_options = @("/O1", "/Ob0", "/GS-", "/EHsc"); linker_options = @() }
            [ordered]@{ name = "cpp-o2-gs"; source = "tests/msvc_x64_corpus/prologue_cpp.cpp"; compiler_options = @("/O2", "/Ob2", "/GS", "/EHsc"); linker_options = @() }
            [ordered]@{ name = "cpp-o2-cfguard"; source = "tests/msvc_x64_corpus/prologue_cpp.cpp"; compiler_options = @("/O2", "/Ob2", "/GS", "/EHsc", "/guard:cf"); linker_options = @("/guard:cf") }
          )
          $corpusSources = @(
            "tests/msvc_x64_corpus/prologue_c.c"
            "tests/msvc_x64_corpus/prologue_cpp.cpp"
          ) | Select-Object -Unique | ForEach-Object {
            $sourcePath = Join-Path $env:GITHUB_WORKSPACE $_
            [ordered]@{
              path = $_
              sha256 = (Get-FileHash -Algorithm SHA256 -Path $sourcePath).Hash.ToLowerInvariant()
            }
          }
          @{
            schema_version = 1
            source = "controlled MSVC 2022 x64 prologue corpus plus pinned independent application releases"
            repository = $env:GITHUB_REPOSITORY
            ref = $env:GITHUB_REF
            commit = $env:GITHUB_SHA
            collection_root = "msvc-corpus-build"
            msvc_toolset_version = $toolset.Name
            visual_studio = @{
              display_name = $visualStudio.displayName
              product_version = $visualStudio.installationVersion
              installation_path = $visualStudio.installationPath
            }
            runner = @{
              label = "windows-2022"
              os = $env:RUNNER_OS
              architecture = $env:RUNNER_ARCH
              image = "$env:ImageOS-$env:ImageVersion"
            }
            llvm_pdbutil_version = $pdbutilVersion
            external_sources = @($externalManifest.sources)
            corpus = @{
              source_directory = "tests/msvc_x64_corpus"
              sources = $corpusSources
              variants = $corpusVariants
            }
          } | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 -Path $env:CONTEXT_FILE
          @(
            "visual_studio_version=$($visualStudio.installationVersion)"
            "msvc_toolset_version=$($toolset.Name)"
            "llvm_pdbutil_version=$pdbutilVersion"
          ) | Add-Content -Encoding utf8 -Path "$env:ARTIFACT_DIR/runner-metadata.txt"
          "VS_DEVCMD=$vsDevCmd" | Add-Content -Encoding utf8 -Path $env:GITHUB_ENV
          "LLVM_PDBUTIL=$pdbutil" | Add-Content -Encoding utf8 -Path $env:GITHUB_ENV

      - name: Download independent application PE/PDB releases
        run: |
          $context = Get-Content -Raw $env:CONTEXT_FILE | ConvertFrom-Json
          $sevenZipCandidates = @(
            (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
            (Join-Path ${env:ProgramFiles} "7-Zip\7z.exe")
            (Join-Path ${env:ProgramFiles(x86)} "7-Zip\7z.exe")
          )
          $sevenZip = $sevenZipCandidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if ($null -eq $sevenZip) { throw "7-Zip was not found on the windows-2022 runner" }
          $externalRoot = Join-Path $env:GITHUB_WORKSPACE "msvc-external-build"
          New-Item -ItemType Directory -Force -Path $externalRoot | Out-Null
          $sourceRoots = @()
          foreach ($source in @($context.external_sources)) {
            $sourceRoot = Join-Path $externalRoot $source.id
            New-Item -ItemType Directory -Force -Path $sourceRoot | Out-Null
            foreach ($kind in @("pe", "pdb")) {
              $asset = if ($kind -eq "pe") { $source.pe_asset } else { $source.pdb_asset }
              $url = if ($kind -eq "pe") { $source.pe_url } else { $source.pdb_url }
              $expected = if ($kind -eq "pe") { $source.pe_sha256 } else { $source.pdb_sha256 }
              $archive = Join-Path $env:RUNNER_TEMP "$($source.id)-$kind-$asset"
              Invoke-WebRequest -Uri $url -OutFile $archive
              $actual = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
              if ($actual -ne $expected) { throw "SHA-256 mismatch for ${asset}: expected $expected, got $actual" }
              & $sevenZip x $archive "-o$sourceRoot" -y | Out-Host
              if ($LASTEXITCODE -ne 0) { throw "7-Zip failed for $asset" }
              if ($kind -eq "pe") {
                Get-ChildItem -Path $sourceRoot -Recurse -File -Filter "*.pdb" | Remove-Item -Force
              }
            }
            $sourceRoots += $sourceRoot
          }
          "MSVC_EXTERNAL_ROOTS=$($sourceRoots -join '|')" | Add-Content -Encoding utf8 -Path $env:GITHUB_ENV

      - name: Build controlled MSVC prologue corpus
        run: |
          $context = Get-Content -Raw $env:CONTEXT_FILE | ConvertFrom-Json
          $corpusRoot = Join-Path $env:GITHUB_WORKSPACE "msvc-corpus-build"
          New-Item -ItemType Directory -Force -Path $corpusRoot | Out-Null
          foreach ($variant in $context.corpus.variants) {
            $source = Join-Path $env:GITHUB_WORKSPACE $variant.source
            $variantRoot = Join-Path $corpusRoot $variant.name
            New-Item -ItemType Directory -Force -Path $variantRoot | Out-Null
            $executable = Join-Path $variantRoot "$($variant.name).exe"
            $pdb = Join-Path $variantRoot "$($variant.name).pdb"
            $compilerOptions = @($variant.compiler_options) -join " "
            $linkerOptions = @($variant.linker_options) -join " "
            $command = "call `"$env:VS_DEVCMD`" -arch=x64 -host_arch=x64 && cl.exe /nologo /Zi $compilerOptions `"$source`" /Fe:`"$executable`" /link /debug /pdb:`"$pdb`" $linkerOptions"
            & cmd.exe /d /s /c $command
            if ($LASTEXITCODE -ne 0) { throw "MSVC build failed for $($variant.name)" }
            if (-not (Test-Path $executable) -or -not (Test-Path $pdb)) { throw "Missing output for $($variant.name)" }
          }
          "MSVC_CORPUS_ROOT=$corpusRoot" | Add-Content -Encoding utf8 -Path $env:GITHUB_ENV

      - name: Collect verified PE/PDB pairs
        run: |
          $arguments = @(".github/workflows/scripts/collect_msvc_x64_targets.py", "--source-root", $env:MSVC_CORPUS_ROOT)
          foreach ($root in ($env:MSVC_EXTERNAL_ROOTS -split '\|')) {
            $arguments += @("--source-root", $root)
          }
          $arguments += @("--llvm-pdbutil", $env:LLVM_PDBUTIL, "--context-json", $env:CONTEXT_FILE, "--output-dir", $env:ARTIFACT_DIR)
          python @arguments

      - name: Upload PE/PDB targets
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msvc-x64-pdb-targets
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Require at least one verified pair
        if: always()
        run: |
          $summary = Get-Content -Raw "$env:ARTIFACT_DIR/summary.json" | ConvertFrom-Json
          $records = @(Get-Content "$env:ARTIFACT_DIR/manifest.jsonl" | Where-Object { $_.Trim() } | ForEach-Object { $_ | ConvertFrom-Json })
          $externalSourceCount = @($records | Where-Object { $_.pe.source_id -ne "msvc-corpus-build" } | Select-Object -ExpandProperty pe | Select-Object -ExpandProperty source_id -Unique).Count
          if ($summary.status -ne "matched" -or [int]$summary.unique_binary_count -lt [int]$env:EXPECTED_CORPUS_TARGET_COUNT -or $externalSourceCount -lt [int]$env:EXPECTED_EXTERNAL_SOURCE_COUNT) {
            throw "Expected the controlled corpus plus $env:EXPECTED_EXTERNAL_SOURCE_COUNT independent application sources"
          }
